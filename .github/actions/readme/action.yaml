name: "Create Usecase README.md"
description: "Creates a usecase README.md file for a given usecase."
inputs:
  usecase_folder:
    description: "Usecase folder"
    required: true

runs:
  using: "composite"
  steps:
    - name: Create Readme
      shell: bash
      working-directory: "alh/users/${{ inputs.usecase_folder }}"
      run: |
      
        # create Readme file & add usecase details,
        echo "## MAD Infra Details" > README.md
        # Extract project specific details
        # yq -r '"**Usecase:** \(.project)"' project-config.yaml >> README.md
        # Add table header
        cat <<EOF >> README.md
        | Environment | SPN | Workspace URL | User | PowerUser | Azure Resource Group |
        | ----------- | --- | -------------- | ---- | ---------- | -------------------- |
        EOF
       
        cat README.md

    - name: push
      shell: bash
      run: |
        git config --local user.email "${{ github.actor }}@users.noreply.github.com"
        git config --local user.name "${{ github.actor }}"
        git add README.md
        git commit -m "Update README.md"
        git push
